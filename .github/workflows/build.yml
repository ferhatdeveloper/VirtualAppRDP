# ===============================================
# Rdp Virtual Box App — Build Workflow
# ===============================================
# Triggers:
#   - push to main / develop
#   - pull_request targeting main
#   - workflow_dispatch (manual)
#
# Jobs (parallel; macOS cannot hide Windows artifacts):
#   1. build — windows-latest + Chocolatey Inno Setup (ISCC)
#      Client + Server setup EXEs. Fail on nonzero ISCC. No fallback.
#   2. build-macos — macos-latest Swift tests + DMG
#      continue-on-error: a Swift/DMG failure must not fail the whole
#      workflow (Windows EXEs are the main product).
#   3. build-android — ubuntu-latest Kotlin/Compose APK
#      continue-on-error: an Android SDK/Gradle failure must not fail
#      the whole workflow (Windows EXEs are the main product).
#   4. build-ios — macos-latest XcodeGen + simulator compile
#      continue-on-error: iOS compile must not fail Windows EXEs.
# ===============================================

name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Queue consecutive runs; do not cancel an in-flight Windows compile.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Setup Executables (Windows + Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PowerShell parse check (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem -Path src -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              Write-Host "PARSE ERROR: $($f.FullName)"
              $parseErrors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            }
          }
          if ($failed) {
            Write-Host "Parse issues found (non-blocking; compile continues)."
          } else {
            Write-Host "Parse check OK ($($files.Count) files)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc after Chocolatey install"
          }
          Write-Host "ISCC ready: $iscc"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Build React dashboard
        working-directory: src/dashboard
        shell: pwsh
        run: |
          npm ci
          npm run build
          if (-not (Test-Path -LiteralPath 'dist\index.html')) {
            throw "Dashboard dist/index.html missing after vite build"
          }

      - name: Compile Client and Server setup (ISCC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }

          New-Item -ItemType Directory -Force -Path 'build\output' | Out-Null
          $outDir = (Resolve-Path -LiteralPath 'build\output').Path
          Write-Host "OutputDir override: $outDir"

          $scripts = @(
            'src\inno\RdpVirtualBoxApp-Client.iss',
            'src\inno\RdpVirtualBoxApp-Server.iss'
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path -LiteralPath $script)) {
              throw "ISS script not found: $script"
            }
            Write-Host "=== ISCC $script ==="
            & $iscc "/O$outDir" $script
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed for $script with exit code $LASTEXITCODE (no fallback installer)"
            }
            Write-Host "ISCC OK: $script"
          }

          $exes = @(Get-ChildItem -Path $outDir -Filter '*.exe' -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            throw "ISCC reported success but no EXE was written to $outDir"
          }
          $exes | ForEach-Object { Write-Host ("  {0}  {1} bytes" -f $_.Name, $_.Length) }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = 'build\output'
          $exes = @(Get-ChildItem -Path $outDir -Filter '*.exe' | Sort-Object Name)
          if ($exes.Count -eq 0) {
            throw "No EXE files in $outDir to hash"
          }
          $lines = foreach ($f in $exes) {
            $hash = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, $f.Name
          }
          $sums = Join-Path $outDir 'SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $sums -Encoding ascii
          Write-Host "=== SHA256SUMS.txt ==="
          Get-Content -LiteralPath $sums | ForEach-Object { Write-Host $_ }

      - name: Upload Windows setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdp-virtual-box-app
          path: |
            build/output/*Client*.exe
            build/output/*Server*.exe
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # macOS Native Client — parallel with Windows (no needs:)
  # Job-level continue-on-error: Swift/DMG failure must not mark Build failed.
  build-macos:
    name: Build macOS Native Client (SwiftUI + DMG)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Run Swift tests
        run: |
          swift test --package-path src/swift/RdpVirtualBoxApp

      - name: Build .app bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          RAW="${GITHUB_REF_NAME:-}"
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Ref '${RAW}' is not semver; using 1.0.1"
            VERSION="1.0.1"
          fi
          mkdir -p build/output
          bash src/swift/RdpVirtualBoxApp/build/make-dmg.sh \
            --version "$VERSION" \
            --output build/output

      - name: Generate SHA256SUMS (macOS DMG)
        shell: bash
        run: |
          set -euo pipefail
          cd build/output
          shopt -s nullglob
          files=(*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no DMG produced in build/output"
            ls -la
            exit 1
          fi
          : > SHA256SUMS-macOS.txt
          for f in "${files[@]}"; do
            shasum -a 256 "$f" >> SHA256SUMS-macOS.txt
          done
          cat SHA256SUMS-macOS.txt

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdp-virtual-box-app-macos
          path: |
            build/output/*.dmg
            build/output/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK (Kotlin / Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create sideload keystore
        working-directory: src/android/ExfinRemoteApp
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore sideload.jks -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=EXFIN RemoteAPP Sideload,O=EXFIN,C=TR"

      - name: Assemble signed release APK
        working-directory: src/android/ExfinRemoteApp
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK is signed
        working-directory: src/android/ExfinRemoteApp
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/apk/release/
          test -f "$APK"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF)$'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exfin-remoteapp-android
          path: src/android/ExfinRemoteApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS client (Xcode simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: bash src/ios/ExfinRemoteApp/generate-xcode.sh

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project src/ios/ExfinRemoteApp/ExfinRemoteApp.xcodeproj \
            -scheme ExfinRemoteApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
