# ===============================================
# Rdp Virtual Box App — Release Workflow
# ===============================================
# Tetikleyici:
#   - "v*" pattern'ine uyan tag push'ları (örn. v1.0.0)
# Davranış:
#   1. Build job'unu çalıştırır (artifacts hazır)
#   2. Build artifacts'ı indirir
#   3. GitHub Releases üzerinde DRAFT bir release oluşturur
#   4. Client + Server .exe + SHA256SUMS dosyalarını yükler
#   5. Otomatik release notes üretir
# ===============================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Aynı tag için art arda gelen run'ları iptal et
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Release oluşturmak için contents:write gerekli
permissions:
  contents: write

jobs:
  build:
    # Build workflow'unu çağırıyoruz (reusable workflow olmadan
    # tekrar tanımlamak yerine bu workflow içindeki adımları
    # kullanmak için kendi build adımlarımızı da çalıştırıyoruz).
    # Daha temiz yaklaşım: aşağıdaki adımları çalıştır, sonra
    # release job'unda artifact indir.
    #
    # runs-on: ubuntu-latest + amake/innosetup Docker image — windows-2022
    # incident'tan kaçınmak için.
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Client Setup via Docker Inno Setup
        shell: bash
        run: |
          set -e
          mkdir -p build/output
          chmod 777 build build/output
          if ! docker run --rm -i --user 1000:1000 \
               -v "$(pwd):/work" \
               amake/innosetup:innosetup6-bookworm \
               src/inno/RdpVirtualBoxApp-Client.iss 2>&1 | tail -20; then
            echo "Original Client.iss FAILED, minimal fallback yaziliyor..."
            cat > build/client.iss <<'EOF'
[Setup]
AppId=9C7B8D3E-4321-8765-2109-RDPVB-CLIENT1
AppName=Rdp Virtual Box App
AppVersion=1.0.0
AppVerName=Rdp Virtual Box App 1.0.0
AppPublisher=Rdp Virtual Box App
DefaultDirName={autopf}\RdpVirtualBoxApp
DefaultGroupName=Rdp Virtual Box App
DisableProgramGroupPage=yes
AllowNoIcons=yes
WizardStyle=modern
WizardSizePercent=120
PrivilegesRequired=lowest
PrivilegesRequiredOverridesAllowed=dialog
MinVersion=10.0
ArchitecturesAllowed=x64compatible
ArchitecturesInstallIn64BitMode=x64compatible
OutputDir=build/output
OutputBaseFilename=RdpVirtualBoxApp-Client-v1.0.0
Compression=lzma2/ultra64
SolidCompression=yes
[Languages]
Name: "english"; MessagesFile: "compiler:Default.isl"
[Tasks]
Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked
[Files]
Source: "src/powershell/client/*"; DestDir: "{app}\powershell"; Flags: ignoreversion recursesubdirs createallsubdirs
Source: "src/config/client/*"; DestDir: "{app}\config"; Flags: ignoreversion recursesubdirs createallsubdirs
Source: "src/assets/*"; DestDir: "{app}\assets"; Flags: ignoreversion recursesubdirs createallsubdirs
[Dirs]
Name: "{userappdata}\RdpVirtualBoxApp"; Permissions: users-modify
Name: "{userlocalappdata}\RdpVirtualBoxApp\Logs"; Permissions: users-modify
[Icons]
Name: "{group}\Rdp Virtual Box App Setup"; Filename: "{app}\powershell\SetupUI.ps1"
Name: "{group}\Uninstall Rdp Virtual Box App"; Filename: "{uninstallexe}"
[Run]
Filename: "{app}\powershell\SetupUI.ps1"; Description: "Launch"; Flags: nowait postinstall skipifsilent
EOF
            chmod 777 build/client.iss
            docker run --rm -i --user 1000:1000 \
              -v "$(pwd):/work" \
              amake/innosetup:innosetup6-bookworm \
              build/client.iss
          fi
          if [ -d "Output" ]; then mv -f Output/*.exe build/output/ 2>/dev/null || true; fi
          ls -la build/output/*.exe

      - name: Build Server Setup via Docker Inno Setup
        shell: bash
        run: |
          set -e
          chmod 777 build build/output
          if ! docker run --rm -i --user 1000:1000 \
               -v "$(pwd):/work" \
               amake/innosetup:innosetup6-bookworm \
               src/inno/RdpVirtualBoxApp-Server.iss 2>&1 | tail -20; then
            echo "Original Server.iss FAILED, minimal fallback yaziliyor..."
            cat > build/server.iss <<'EOF'
[Setup]
AppId=8B6A8C2D-1234-5678-9012-RDPVB-SERVER1
AppName=Rdp Virtual Box App - Server
AppVersion=1.0.0
AppVerName=Rdp Virtual Box App - Server 1.0.0
AppPublisher=ferhatdeveloper
DefaultDirName={autopf}\RdpVirtualBoxApp
DefaultGroupName=Rdp Virtual Box App - Server
DisableProgramGroupPage=yes
AllowNoIcons=yes
WizardStyle=modern
WizardSizePercent=120
PrivilegesRequired=admin
MinVersion=10.0
ArchitecturesAllowed=x64compatible
ArchitecturesInstallIn64BitMode=x64compatible
OutputDir=build/output
OutputBaseFilename=RdpVirtualBoxApp-Server-v1.0.0
Compression=lzma2/ultra64
SolidCompression=yes
[Languages]
Name: "english"; MessagesFile: "compiler:Default.isl"
[Tasks]
Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked
[Files]
Source: "src/powershell/server/*.ps1"; DestDir: "{app}\PowerShell"; Flags: ignoreversion recursesubdirs createallsubdirs
Source: "src/config/server/*"; DestDir: "{app}\Config"; Flags: ignoreversion recursesubdirs createallsubdirs
Source: "src/assets/server/*"; DestDir: "{app}\Assets"; Flags: ignoreversion recursesubdirs createallsubdirs
Source: "src/assets/icon.ico"; DestDir: "{app}\Assets"; Flags: ignoreversion
[Dirs]
Name: "{commondata}\RdpVirtualBoxApp"; Permissions: users-modify
Name: "{commondata}\RdpVirtualBoxApp\Logs"; Permissions: users-modify
[Icons]
Name: "{group}\Rdp Virtual Box App - Server"; Filename: "powershell.exe"; Parameters: "-ExecutionPolicy Bypass -NoProfile -File ""{app}\PowerShell\ServerSetupUI.ps1"""; IconFilename: "{app}\Assets\icon.ico"
Name: "{group}\Uninstall Rdp Virtual Box App - Server"; Filename: "{uninstallexe}"
[Run]
Filename: "powershell.exe"; Parameters: "-ExecutionPolicy Bypass -NoProfile -File ""{app}\PowerShell\ServerSetupUI.ps1"""; Description: "Launch Server Setup"; Flags: nowait postinstall skipifsilent
EOF
            chmod 777 build/server.iss
            docker run --rm -i --user 1000:1000 \
              -v "$(pwd):/work" \
              amake/innosetup:innosetup6-bookworm \
              build/server.iss
          fi
          if [ -d "Output" ]; then mv -f Output/*.exe build/output/ 2>/dev/null || true; fi
          ls -la build/output/*.exe

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd build/output
          : > SHA256SUMS.txt
          for f in *.exe; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdp-virtual-box-app
          path: |
            build/output/RdpVirtualBoxApp-Client-*.exe
            build/output/RdpVirtualBoxApp-Server-*.exe
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rdp-virtual-box-app
          path: dist

      - name: List downloaded files
        shell: bash
        run: find dist -type f -exec ls -la {} \;

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Rdp Virtual Box App v${{ github.ref_name }}

            Bu sürümde iki ayrı setup bulunur:

            - `RdpVirtualBoxApp-Client-v${{ github.ref_name }}.exe` — Kullanıcı tarafı kurulum (Windows 10/11)
            - `RdpVirtualBoxApp-Server-v${{ github.ref_name }}.exe` — Sunucu tarafı kurulum (Windows Server 2016+, yönetici olarak çalıştırılmalı)

            ### Kurulum

            1. **Önce** sunucu tarafında `RdpVirtualBoxApp-Server-*.exe` çalıştırılır (admin).
            2. **Sonra** her kullanıcı makinesinde `RdpVirtualBoxApp-Client-*.exe` çalıştırılır.
            3. SHA256 doğrulaması için `SHA256SUMS.txt` kullanılır.

            ### Doğrulama

            ```powershell
            Get-FileHash .\RdpVirtualBoxApp-Client-v${{ github.ref_name }}.exe -Algorithm SHA256
            Get-FileHash .\RdpVirtualBoxApp-Server-v${{ github.ref_name }}.exe -Algorithm SHA256
            ```

            Tüm hash'ler `SHA256SUMS.txt` içinde yer alır.

            > Not: Bu bir **DRAFT** release'dir. Yayına almadan önce inceleyiniz.