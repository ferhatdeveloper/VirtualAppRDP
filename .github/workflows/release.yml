# ===============================================
# Rdp Virtual Box App — Release Workflow
# ===============================================
# Triggers:
#   - tag push matching v* (e.g. v1.0.1)
#   - workflow_dispatch (manual)
#
# Behaviour:
#   1. Compile Client + Server setup on windows-latest with native ISCC
#      (Chocolatey Inno Setup). Fail on nonzero ISCC. No empty fallback.
#   2. Upload artifacts, then create a GitHub Release from dist/*
# ===============================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Setup Executables (Windows + Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc after Chocolatey install"
          }
          Write-Host "ISCC ready: $iscc"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Build React dashboard
        working-directory: src/dashboard
        shell: pwsh
        run: |
          npm ci
          npm run build
          if (-not (Test-Path -LiteralPath 'dist\index.html')) {
            throw "Dashboard dist/index.html missing after vite build"
          }

      - name: Compile Client and Server setup (ISCC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }

          New-Item -ItemType Directory -Force -Path 'build\output' | Out-Null
          $outDir = (Resolve-Path -LiteralPath 'build\output').Path
          Write-Host "OutputDir override: $outDir"

          $scripts = @(
            'src\inno\RdpVirtualBoxApp-Client.iss',
            'src\inno\RdpVirtualBoxApp-Server.iss'
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path -LiteralPath $script)) {
              throw "ISS script not found: $script"
            }
            Write-Host "=== ISCC $script ==="
            & $iscc "/O$outDir" $script
            if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed for $script with exit code $LASTEXITCODE (no fallback installer)"
            }
            Write-Host "ISCC OK: $script"
          }

          $exes = @(Get-ChildItem -Path $outDir -Filter '*.exe' -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            throw "ISCC reported success but no EXE was written to $outDir"
          }
          $exes | ForEach-Object { Write-Host ("  {0}  {1} bytes" -f $_.Name, $_.Length) }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = 'build\output'
          $exes = @(Get-ChildItem -Path $outDir -Filter '*.exe' | Sort-Object Name)
          if ($exes.Count -eq 0) {
            throw "No EXE files in $outDir to hash"
          }
          $lines = foreach ($f in $exes) {
            $hash = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, $f.Name
          }
          $sums = Join-Path $outDir 'SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $sums -Encoding ascii
          Write-Host "=== SHA256SUMS.txt ==="
          Get-Content -LiteralPath $sums | ForEach-Object { Write-Host $_ }

      - name: Upload Windows setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdp-virtual-box-app
          path: |
            build/output/*Client*.exe
            build/output/*Server*.exe
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rdp-virtual-box-app
          path: dist

      - name: List downloaded files
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -exec ls -la {} \;
          count=$(find dist -type f \( -name '*Client*.exe' -o -name '*Server*.exe' \) | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "ERROR: expected Client and Server EXEs in dist/; refusing empty fallback"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Rdp Virtual Box App ${{ github.ref_name }}

            Bu sürümde iki ayrı setup bulunur:

            - `RdpVirtualBoxApp-Client-*.exe` — Kullanıcı tarafı kurulum (Windows 10/11)
            - `RdpVirtualBoxApp-Server-*.exe` — Sunucu tarafı kurulum (Windows Server 2016+, yönetici olarak çalıştırılmalı)

            ### Kurulum

            1. **Önce** sunucu tarafında `RdpVirtualBoxApp-Server-*.exe` çalıştırılır (admin).
            2. **Sonra** her kullanıcı makinesinde `RdpVirtualBoxApp-Client-*.exe` çalıştırılır.
            3. SHA256 doğrulaması için `SHA256SUMS.txt` kullanılır.

            ### Doğrulama

            ```powershell
            Get-FileHash .\RdpVirtualBoxApp-Client-*.exe -Algorithm SHA256
            Get-FileHash .\RdpVirtualBoxApp-Server-*.exe -Algorithm SHA256
            ```

            Tüm hash'ler `SHA256SUMS.txt` içinde yer alır.
